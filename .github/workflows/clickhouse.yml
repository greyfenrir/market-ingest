name: ClickHouse schema upgrade

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to test (empty for this branch)
        required: false
        type: string
      baseline_ref:
        description: Schema revision to upgrade from (empty for origin/main)
        required: false
        type: string

permissions:
  contents: read

jobs:
  schema-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'
      - name: Install collector dependencies
        run: python -m pip install -r requirements.txt
      - name: Test fresh schema and upgrade
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_OVERRIDE: ${{ inputs.baseline_ref }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${BASE_OVERRIDE:-$EVENT_BASE}"
          if [[ "$base_ref" =~ ^0+$ ]]; then
            base_ref=origin/main
          fi
          args=(--base-ref "$base_ref")
          if [[ -n "$PR_NUMBER" ]]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid PR number' >&2; exit 2; }
            git fetch --no-tags origin "pull/$PR_NUMBER/head:refs/remotes/origin/schema-test-pr"
            args+=(--target-ref refs/remotes/origin/schema-test-pr)
          fi
          python tests/test_clickhouse_upgrade.py "${args[@]}"
