# Copy to /etc/market-ingest/config.toml on the server.
# One section per exchange, named as the --exchange argument and the systemd
# instance (market-ingest@binance_um reads [binance_um]); a collector refuses to
# start without its section.
# Secrets do NOT live here - see /etc/market-ingest/env.

[clickhouse]
url      = "http://127.0.0.1:8123"
user     = "ingest"
database = "market"
# password comes from the CH_PASSWORD environment variable

[ingest]
# An insert is sent when either limit is hit first.
#
# Do not lower batch_max_seconds without measuring. At 2s this produced 1345
# parts an hour averaging 8 KiB each, and 350 merges to clean up after them -
# ClickHouse wants few large parts, not many small ones. 30s yields ~120 parts
# an hour of a workable size. The cost is that a SIGKILL loses up to 30s of
# data; a normal restart loses nothing, because SIGTERM drains the sink.
batch_max_rows    = 20000
batch_max_seconds = 30.0
# Rows kept in memory when ClickHouse is unreachable. Beyond this we drop the
# oldest and count it - a collector that OOMs loses far more than a few rows.
queue_max_rows    = 400000

# Throughput and archive size are published to Netdata's built-in StatsD
# receiver (UDP 127.0.0.1:8125), so collector metrics appear next to the host's
# CPU and disk instead of in a second dashboard.
[metrics]
enabled     = true
statsd_host = "127.0.0.1"
statsd_port = 8125
prefix      = "market_ingest"

[binance_um]
enabled = true

# Full-rate capture: every mark-price tick (1/s) and every aggregate trade.
# Everything NOT in this list still gets one mark-price row per minute.
focus_symbols = [
    "BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "BNBUSDT",
    "DOGEUSDT", "ADAUSDT", "LINKUSDT", "AVAXUSDT", "SUIUSDT",
    "LTCUSDT", "TRXUSDT", "DOTUSDT", "NEARUSDT", "APTUSDT",
    "ARBUSDT", "OPUSDT", "HYPEUSDT", "FILUSDT", "INJUSDT",
]

# Open interest has no WebSocket stream - it is polled over REST.
open_interest_poll_seconds = 60
open_interest_symbols      = "focus"   # "focus" or "all"

# REST request weight this collector may spend per minute: snapshots, the OI
# poll, exchangeInfo. Binance allows 2400 per IP and counts everything sent
# from it; the collector follows Binance's own count when it is higher.
rest_weight_per_minute = 1200

# Binance drops WebSocket connections after 24h. Beat it to the punch.
# (Must stay above the first [binance_um.*] header: TOML would otherwise file
# it under that table, where nothing reads it.)
reconnect_after_hours = 23

# A stream that goes quiet for longer than this is treated as broken and
# reconnected. Silence is the failure mode that looks like success.
[binance_um.stall_seconds]
mark_price   = 30
agg_trade    = 900
force_order  = 7200
depth        = 30

# Order book: a local book per symbol from a REST snapshot plus @depth deltas
# on the /public route, written to market.book_agg as one row per second.
# Raw deltas are not kept.
[binance_um.depth]
enabled                = true
symbols                = "focus"   # "focus" or a list of symbols
update_speed_ms        = 100       # 100 or 500
# 1000 levels weigh 20 against the REST limit and reach only ~+-0.16 % on BTC;
# beyond that the book knows the levels deltas have shown it, which matched
# Binance's own depth archive once the book had run for a while (book_age_s).
snapshot_limit         = 1000
max_parallel_snapshots = 2
# Levels further than this from mid are dropped: deltas add far levels and
# nothing else ever removes them.
prune_pct              = 10
# A live book with no delta for this long is reported as stale.
stale_seconds          = 5
# A snapshot's reach is fixed when it is taken; the market walks away from it.
# Once either side keeps less than refresh_ratio of the coverage the snapshot
# had, a fresh one is built alongside and swapped in without a gap - at most
# once per refresh_min_seconds per symbol (20 weight each).
refresh_ratio          = 0.5
refresh_min_seconds    = 60

[bybit_linear]
enabled = true

# Bybit takes at most 100 topics per connection; the collector refuses to
# start with more focus or depth symbols than that.
focus_symbols = [
    "BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "BNBUSDT",
    "DOGEUSDT", "ADAUSDT", "LINKUSDT", "AVAXUSDT", "SUIUSDT",
    "LTCUSDT", "TRXUSDT", "DOTUSDT", "NEARUSDT", "APTUSDT",
    "ARBUSDT", "OPUSDT", "HYPEUSDT", "FILUSDT", "INJUSDT",
]

# One GET /v5/market/tickers per period: open interest for these symbols, and
# the sampled mark price of every non-focus symbol.
open_interest_poll_seconds = 60
open_interest_symbols      = "focus"   # "focus" or "all"

# Bybit allows 600 requests per 5 s per IP and answers a breach with a 403
# and a ban of at least 10 minutes.
rest_requests_per_5s = 300

reconnect_after_hours = 23

[bybit_linear.stall_seconds]
mark_price   = 30
agg_trade    = 900
force_order  = 7200
depth        = 30

# Order book: snapshot and deltas both come on the socket. Bybit itself keeps
# the book to its top `levels`, so the book reaches as far as its last level
# and no further (~+-0.25 % on BTC at 1000 levels) - unlike Binance, depth
# beyond that cannot be learned from deltas.
[bybit_linear.depth]
enabled                   = true
symbols                   = "focus"   # "focus" or a list of symbols
levels                    = 1000      # 1, 50, 200 or 1000
stale_seconds             = 5
# A book left without a snapshot this long is subscribed again.
resubscribe_after_seconds = 10
