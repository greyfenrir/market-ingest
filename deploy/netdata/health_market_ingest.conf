# Health alarms for the collectors.
# Installed to /etc/netdata/health.d/market_ingest.conf
#
# Netdata's built-in alarms watch the host: disk, RAM, CPU, services. None of
# them can tell that a websocket is open and silent, which is the failure this
# project has already hit twice. These rules watch the thing that actually
# matters: whether rows are still arriving, and whether we know what we missed.
#
# `foreach *` makes one alarm per dimension of the chart - per exchange, or per
# exchange and stream - named <template>_<dimension>. Nothing here names an
# exchange: a new collector is watched as soon as its metrics arrive.

 template: market_ingest_stalled
       on: market_ingest.rows_by_exchange
    class: Errors
     type: Data Collection
component: market-ingest
   lookup: sum -2m unaligned foreach *
    units: rows
    every: 30s
     crit: $this == 0
    delay: down 5m
     info: an exchange wrote no rows in two minutes - its collector is down, \
           or its streams are connected and silent
       to: sysadmin

 template: market_ingest_write_queue
       on: market_ingest.sink
   lookup: max -1m unaligned foreach *
    units: rows
    every: 30s
     warn: $this > 50000
     crit: $this > 200000
    delay: down 10m
     info: rows are piling up unwritten - ClickHouse is slow or unreachable
       to: sysadmin

 template: market_ingest_dropped
       on: market_ingest.dropped
   lookup: max -1m unaligned foreach *
    units: rows
    every: 1m
     crit: $this > 0
     info: the write queue overflowed and market data was discarded - this is \
           unrecoverable loss, the archive has a hole
       to: sysadmin

 template: market_ingest_gaps
       on: market_ingest.gaps
   lookup: sum -10m unaligned foreach *
    units: trades
    every: 1m
     warn: $this > 0
    delay: down 30m
     info: trades proven missing from the archive by a sequence-id jump
       to: sysadmin

 template: market_ingest_book_quality
       on: market_ingest.book_quality
   lookup: max -1m unaligned foreach *
    units: %
    every: 1m
     warn: $this > 5
     crit: $this > 20
    delay: down 15m
     info: an order book spent too many of the last ten minutes degraded, \
           stale or resyncing - its depth figures are not the whole truth
       to: sysadmin

 template: market_ingest_lag
       on: market_ingest.lag
   lookup: max -2m unaligned foreach *
    units: ms
    every: 1m
     warn: $this > 5000
     crit: $this > 30000
    delay: down 10m
     info: falling behind the exchange clock - network, clock skew, or a \
           collector that cannot keep up
       to: sysadmin
