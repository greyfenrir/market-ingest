# Synthetic StatsD charts for the collectors.
# Installed to /etc/netdata/statsd.d/market_ingest.conf
#
# Every dimension is a `pattern`, which in Netdata means one dimension per
# matched metric with the wildcard text as its name. That is what makes this
# file survive adding exchanges: a bybit collector publishing
# market_ingest.rows.bybit.agg_trade appears as its own band on the same chart
# with no edit here.
#
# private charts = no suppresses the one-chart-per-metric default; without it
# these summaries would sit next to two dozen single-line charts saying the
# same thing.

[app]
    name = market_ingest
    metrics = market_ingest.*
    private charts = no
    gaps when not collected = no

[rows]
    name = rows
    title = Rows written to ClickHouse per collector
    family = ingest
    context = market_ingest.rows
    units = rows/s
    type = stacked
    priority = 1000
    dimension = pattern 'market_ingest.rows.*' '' last 1 1

[bytes]
    name = bytes
    title = Feed volume received per collector
    family = ingest
    context = market_ingest.bytes
    units = bytes/s
    type = stacked
    priority = 1010
    dimension = pattern 'market_ingest.bytes.*' '' last 1 1

[disk_by_exchange]
    name = disk_by_exchange
    title = Archive size on disk, by exchange
    family = archive
    context = market_ingest.disk_by_exchange
    units = bytes
    type = stacked
    priority = 1020
    dimension = pattern 'market_ingest.disk_bytes.exchange.*' '' last 1 1

[disk_by_table]
    name = disk_by_table
    title = Archive size on disk, by table
    family = archive
    context = market_ingest.disk_by_table
    units = bytes
    type = stacked
    priority = 1030
    dimension = pattern 'market_ingest.disk_bytes.table.*' '' last 1 1

[archive_rows]
    name = archive_rows
    title = Rows held in the archive, by exchange
    family = archive
    context = market_ingest.archive_rows
    units = rows
    type = stacked
    priority = 1040
    dimension = pattern 'market_ingest.disk_rows.exchange.*' '' last 1 1

[lag]
    name = lag
    title = Delay behind the exchange clock
    family = ingest
    context = market_ingest.lag
    units = milliseconds
    type = line
    priority = 1050
    dimension = pattern 'market_ingest.lag_ms.*' '' last 1 1

[gaps]
    name = gaps
    title = Trades proven missing from the archive
    family = quality
    context = market_ingest.gaps
    units = trades
    type = stacked
    priority = 1060
    dimension = pattern 'market_ingest.gaps.*' '' last 1 1

[book]
    name = book
    title = Order books resyncing or not fully usable
    family = quality
    context = market_ingest.book
    units = books
    type = line
    priority = 1065
    dimension = pattern 'market_ingest.resyncs.*' '' last 1 1
    dimension = pattern 'market_ingest.refreshes.*' '' last 1 1
    dimension = pattern 'market_ingest.book_not_ok.*' '' last 1 1

[sink]
    name = sink
    title = ClickHouse write queue
    family = quality
    context = market_ingest.sink
    units = rows
    type = line
    priority = 1070
    dimension = pattern 'market_ingest.queue_rows.*' '' last 1 1
    dimension = pattern 'market_ingest.dropped_rows.*' '' last 1 1
